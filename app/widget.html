<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>IEPF Document Upload</title>
	<script src="https://js.zohostatic.com/support/developer_sdk/v1/js/ZohoDeskClientSDK.min.js"></script>
	<link rel="stylesheet" href="widget.css">
</head>

<body>
	<div class="wrapper">
		<div class="card">
			<div class="header">
				<h2>📁 IEPF Document Upload</h2>
				<p>Select a category and upload your documents to WorkDrive</p>
			</div>

			<div class="content">

				<div class="section">
					<div class="label-row">
						<div class="label">
							Document Category <span class="required">*</span>
						</div>
						<div class="hint">Required</div>
					</div>

					<select id="category">
						<option value="">Select a category</option>
						<option value="KFIN Information">KFIN Information</option>
						<option value="VR">VR</option>
						<option value="VR Signed">VR Signed</option>
						<option value="EVR">EVR</option>
						<option value="EVR Signed">EVR Signed</option>
						<option value="Receipt">Receipt</option>
						<option value="Upload Shares Released">Upload Shares Released</option>
						<option value="Upload MCA Report">Upload MCA Report</option>
					</select>
				</div>

				<div class="section" id="dateContainer">
					<div class="label-row">
						<div class="label">
							Document Date <span class="required">*</span>
						</div>
					</div>

					<input type="text" id="date" class="date-input" placeholder="YYYY-MM-DD" maxlength="10"
						autocomplete="off">

					<div class="date-hint">
						Enter date as YYYY-MM-DD, for example 2026-10-14
					</div>
				</div>

				<div class="section">
					<div class="label-row">
						<div class="label">
							Documents <span class="required">*</span>
						</div>
						<div class="hint">Multiple files allowed</div>
					</div>

					<div class="upload-area" id="uploadArea">
						<div class="upload-icon">⬆️</div>
						<div class="upload-title">
							Drop files here or
							<span class="choose-text">browse</span>
						</div>
						<div class="upload-subtitle">
							Select one or more documents
						</div>
						<input type="file" id="fileInput" multiple>
					</div>

					<div id="fileList">
						<div class="file-count" id="fileCount"></div>
						<div class="file-items" id="fileItems"></div>
					</div>
				</div>
				<div class="section button-container">
					<button type="button" class="button" id="uploadBtn">
						⬆ Upload Files
					</button>

					<button type="button" class="button" id="removeFilesBtn">
						🗑 Remove Files
					</button>
				</div>
				<div id="status"></div>
			</div>
		</div>

		<div class="footer">IEPF Document Management</div>
	</div>
	<script src="widget.js"></script>
</body>

</html>

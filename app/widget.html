<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>IEPF Document Upload</title>
	<script src="https://js.zohostatic.com/support/developer_sdk/v1/js/ZohoDeskClientSDK.min.js"></script>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 24px;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
				Roboto, Arial, sans-serif;
			background: #f4f7fb;
			color: #172033;
		}

		.wrapper {
			width: 100%;
			max-width: 620px;
			margin: 0 auto;
		}

		/* ================================
MAIN CARD
================================= */
		.card {
			background: #ffffff;
			border-radius: 18px;
			overflow: hidden;
			box-shadow:
				0 10px 30px rgba(25, 55, 100, 0.10),
				0 2px 8px rgba(25, 55, 100, 0.05);
			border: 1px solid #e7ebf2;
		}

		/* ================================
HEADER
================================= */
		.header {
			padding: 24px 26px;
			background: linear-gradient(135deg,
					#1769d1 0%,
					#0d47a1 100%);
			color: #ffffff;
		}

		.header-top {
			display: flex;
			align-items: center;
			gap: 14px;
		}

		.header-icon {
			width: 46px;
			height: 46px;
			border-radius: 12px;
			background: rgba(255, 255, 255, 0.16);
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 22px;
			flex-shrink: 0;
		}

		.header h2 {
			margin: 0;
			font-size: 21px;
			font-weight: 650;
			letter-spacing: -0.2px;
		}

		.header p {
			margin: 5px 0 0;
			font-size: 13px;
			color: rgba(255, 255, 255, 0.84);
		}

		/* ================================
CONTENT
================================= */
		.content {
			padding: 26px;
		}

		.section {
			margin-bottom: 23px;
		}

		.section:last-child {
			margin-bottom: 0;
		}

		.label-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 8px;
		}

		.label {
			font-size: 13px;
			font-weight: 650;
			color: #293348;
		}

		.required {
			color: #e53935;
			margin-left: 3px;
		}

		.hint {
			font-size: 11px;
			color: #8a94a6;
		}

		/* ================================
SELECT
================================= */
		.select-wrapper {
			position: relative;
		}

		select {
			width: 100%;
			height: 46px;
			padding: 0 42px 0 14px;
			border: 1px solid #d9dfeb;
			border-radius: 10px;
			background: #ffffff;
			color: #273248;
			font-size: 13px;
			appearance: none;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		select:hover {
			border-color: #aeb9cb;
		}

		select:focus {
			outline: none;
			border-color: #1976d2;
			box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.10);
		}

		.select-arrow {
			position: absolute;
			right: 15px;
			top: 50%;
			transform: translateY(-50%);
			pointer-events: none;
			color: #758096;
			font-size: 12px;
		}

		/* ================================
DATE
================================= */
		#dateContainer {
			display: none;
		}

		input[type="text"].date-input {
			width: 100%;
			height: 46px;
			padding: 0 13px;
			border: 1px solid #d9dfeb;
			border-radius: 10px;
			background: #ffffff;
			color: #273248;
			font-size: 13px;
		}

		input[type="text"].date-input:focus {
			outline: none;
			border-color: #1976d2;
			box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.10);
		}

		/* ================================
UPLOAD AREA
================================= */
		.upload-area {
			position: relative;
			border: 2px dashed #cbd5e3;
			border-radius: 13px;
			padding: 25px 18px;
			text-align: center;
			background: #fafcff;
			transition: all 0.2s ease;
			cursor: pointer;
		}

		.upload-area:hover {
			border-color: #1976d2;
			background: #f7fbff;
		}

		.upload-area.drag-active {
			border-color: #1976d2;
			background: #eef6ff;
		}

		.upload-icon {
			width: 48px;
			height: 48px;
			margin: 0 auto 12px;
			border-radius: 50%;
			background: #eaf3ff;
			color: #1976d2;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 22px;
		}

		.upload-title {
			font-size: 14px;
			font-weight: 650;
			color: #293348;
		}

		.upload-subtitle {
			margin-top: 5px;
			font-size: 12px;
			color: #8a94a6;
		}

		.choose-text {
			color: #1976d2;
			font-weight: 600;
		}

		#fileInput {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			opacity: 0;
			cursor: pointer;
		}

		/* ================================
FILE LIST
================================= */
		#fileList {
			display: none;
			margin-top: 12px;
		}

		.file-list-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 8px;
		}

		.file-count {
			font-size: 12px;
			font-weight: 650;
			color: #4b5568;
		}

		.file-items {
			display: flex;
			flex-direction: column;
			gap: 7px;
			max-height: 248px;
			/* Show about four files at a time */
			overflow-y: auto;
			overflow-x: hidden;
			padding: 2px 5px 2px 0;
			scrollbar-width: thin;
			scrollbar-color: #b8c9df #f2f6fb;
		}

		.file-items::-webkit-scrollbar {
			width: 7px;
		}

		.file-items::-webkit-scrollbar-track {
			background: #f2f6fb;
			border-radius: 8px;
		}

		.file-items::-webkit-scrollbar-thumb {
			background: #b8c9df;
			border-radius: 8px;
		}

		.file-items::-webkit-scrollbar-thumb:hover {
			background: #8ea9ca;
		}

		.file-item {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 10px 11px;
			border: 1px solid #e5e9f0;
			border-radius: 9px;
			background: #fafbfc;
		}

		.file-icon {
			width: 30px;
			height: 30px;
			border-radius: 7px;
			background: #edf4ff;
			color: #1976d2;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 14px;
			flex-shrink: 0;
		}

		.file-info {
			min-width: 0;
			flex: 1;
		}

		.file-name {
			font-size: 12px;
			font-weight: 600;
			color: #354052;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.file-size {
			margin-top: 2px;
			font-size: 10px;
			color: #8a94a6;
		}

		/* ================================
UPLOAD BUTTON
================================= */
		.button {
			width: 100%;
			height: 47px;
			border: none;
			border-radius: 10px;
			background: linear-gradient(135deg,
					#1976d2,
					#0d5bbb);
			color: #ffffff;
			font-size: 14px;
			font-weight: 650;
			cursor: pointer;
			box-shadow: 0 5px 12px rgba(25, 118, 210, 0.20);
			transition: all 0.2s ease;
		}

		.button:hover {
			transform: translateY(-1px);
			box-shadow: 0 7px 16px rgba(25, 118, 210, 0.25);
		}

		.button:active {
			transform: translateY(0);
		}

		.button:disabled {
			background: #aeb8c8;
			cursor: not-allowed;
			box-shadow: none;
			transform: none;
		}

		.button-icon {
			margin-right: 7px;
		}

		/* ================================
STATUS
================================= */
		#status {
			display: none;
			margin-top: 15px;
			padding: 13px 14px;
			border-radius: 10px;
			font-size: 12px;
			line-height: 1.5;
		}

		.status-info {
			display: block !important;
			background: #eef6ff;
			border: 1px solid #d7e9ff;
			color: #185a9d;
		}

		.status-success {
			display: block !important;
			background: #eefaf3;
			border: 1px solid #d6f0df;
			color: #217344;
		}

		.status-error {
			display: block !important;
			background: #fff3f3;
			border: 1px solid #f5d6d6;
			color: #b42323;
		}

		.status-warning {
			display: block !important;
			background: #fff9ed;
			border: 1px solid #f5e6c5;
			color: #8a5b08;
		}

		/* ================================
FOOTER
================================= */
		.footer {
			margin-top: 18px;
			text-align: center;
			font-size: 10px;
			color: #9aa3b2;
		}

		/* UI-only refinements */
		body {
			min-height: 100vh;
			padding: clamp(12px, 3vw, 32px);
			background:
				radial-gradient(circle at 8% 4%, rgba(54, 127, 225, .12), transparent 29%),
				radial-gradient(circle at 94% 94%, rgba(50, 166, 143, .09), transparent 26%),
				#f3f6fc;
		}

		.wrapper {
			max-width: 660px;
		}

		.card {
			border: 1px solid #e1e8f2;
			border-radius: 22px;
			box-shadow: 0 22px 55px rgba(26, 49, 86, .12), 0 3px 10px rgba(26, 49, 86, .04);
		}

		.header {
			position: relative;
			isolation: isolate;
			overflow: hidden;
			padding: 28px clamp(20px, 4vw, 32px);
			background: linear-gradient(125deg, #124fa9 0%, #176bd0 58%, #2789e5 100%);
		}

		.header::after {
			content: "";
			position: absolute;
			z-index: -1;
			width: 220px;
			height: 220px;
			right: -68px;
			top: -125px;
			border: 1px solid rgba(255, 255, 255, .18);
			border-radius: 50%;
			box-shadow: 0 0 0 22px rgba(255, 255, 255, .035), 0 0 0 48px rgba(255, 255, 255, .025);
		}

		.header-icon {
			width: 52px;
			height: 52px;
			border: 1px solid rgba(255, 255, 255, .2);
			border-radius: 15px;
			background: rgba(255, 255, 255, .15);
			box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15);
		}

		.header h2 {
			font-size: clamp(20px, 3vw, 23px);
			letter-spacing: -.4px;
		}

		.header p {
			font-size: 13px;
			line-height: 1.55;
		}

		.content {
			padding: clamp(20px, 4vw, 30px);
		}

		.section {
			margin-bottom: 25px;
		}

		.label {
			color: #26364e;
			font-size: 13px;
			letter-spacing: .1px;
		}

		.hint {
			padding: 4px 8px;
			border-radius: 999px;
			background: #f0f4fa;
			color: #6e7b91;
			font-size: 10px;
		}

		select,
		input[type="text"].date-input {
			height: 49px;
			border: 1px solid #d7e0ed;
			border-radius: 12px;
			box-shadow: 0 1px 2px rgba(20, 42, 75, .025);
			transition: border-color .18s ease, box-shadow .18s ease;
		}

		select {
			padding-left: 15px;
			background-color: #fff;
		}

		select:focus,
		input[type="text"].date-input:focus {
			border-color: #3284e8;
			box-shadow: 0 0 0 4px rgba(50, 132, 232, .12);
		}

		.date-hint {
			margin-top: 7px;
			color: #78869b;
			font-size: 11px;
		}

		.date-hint strong {
			color: #315b8d;
		}

		.upload-area {
			padding: 29px 18px;
			border: 2px dashed #c4d3e7;
			border-radius: 16px;
			background: linear-gradient(180deg, #fbfdff 0%, #f6f9ff 100%);
		}

		.upload-area:hover,
		.upload-area.drag-active {
			border-color: #3789e8;
			background: #eff7ff;
			box-shadow: inset 0 0 0 1px rgba(55, 137, 232, .05);
		}

		.upload-icon {
			width: 54px;
			height: 54px;
			border: 1px solid #d6e8ff;
			background: linear-gradient(145deg, #edf6ff, #dcecff);
			color: #1769c2;
			font-size: 24px;
		}

		.upload-title {
			font-size: 14px;
		}

		.upload-subtitle {
			font-size: 12px;
			line-height: 1.6;
		}

		.file-item {
			padding: 11px 12px;
			border-color: #e1e8f2;
			border-radius: 11px;
			background: #fcfdff;
		}

		.file-icon {
			width: 34px;
			height: 34px;
			border-radius: 9px;
		}

		.button {
			height: 50px;
			border-radius: 12px;
			background: linear-gradient(115deg, #1769d1, #0d55b5);
			box-shadow: 0 7px 16px rgba(25, 105, 209, .22);
			letter-spacing: .1px;
		}

		.button:hover {
			box-shadow: 0 9px 22px rgba(25, 105, 209, .28);
		}

		#status {
			border-radius: 12px;
			padding: 14px 15px;
		}

		.footer {
			margin-top: 16px;
			color: #8995a8;
			font-size: 11px;
			letter-spacing: .2px;
		}

		@media (max-width: 480px) {
			body {
				padding: 12px;
			}

			.card {
				border-radius: 17px;
			}

			.header {
				padding: 22px 19px;
			}

			.header-icon {
				width: 46px;
				height: 46px;
			}

			.content {
				padding: 20px 17px;
			}

			.upload-area {
				padding: 23px 12px;
			}
		}
	</style>

</head>

<body>
	<div class="wrapper">
		<div class="card">

			<div class="header">
				<h2>📁 IEPF Document Upload</h2>
				<p>Select a category and upload your documents to WorkDrive</p>
			</div>

			<div class="content">

				<div class="section">
					<div class="label-row">
						<div class="label">
							Document Category <span class="required">*</span>
						</div>
						<div class="hint">Required</div>
					</div>

					<select id="category">
						<option value="">Select a category</option>
						<option value="KFIN Information">KFIN Information</option>
						<option value="VR">VR</option>
						<option value="VR Signed">VR Signed</option>
						<option value="EVR">EVR</option>
						<option value="EVR Signed">EVR Signed</option>
						<option value="Receipt">Receipt</option>
						<option value="Upload Shares Released">Upload Shares Released</option>
						<option value="Upload MCA Report">Upload MCA Report</option>
					</select>
				</div>

				<div class="section" id="dateContainer">
					<div class="label-row">
						<div class="label">
							Document Date <span class="required">*</span>
						</div>
					</div>

					<input type="text" id="date" class="date-input" placeholder="YYYY-MM-DD" maxlength="10"
						autocomplete="off">

					<div class="date-hint">
						Enter date as YYYY-MM-DD, for example 2026-10-14
					</div>
				</div>

				<div class="section">
					<div class="label-row">
						<div class="label">
							Documents <span class="required">*</span>
						</div>
						<div class="hint">Multiple files allowed</div>
					</div>

					<div class="upload-area" id="uploadArea">
						<div class="upload-icon">⬆️</div>
						<div class="upload-title">
							Drop files here or
							<span class="choose-text">browse</span>
						</div>
						<div class="upload-subtitle">
							Select one or more documents
						</div>
						<input type="file" id="fileInput" multiple>
					</div>

					<div id="fileList">
						<div class="file-count" id="fileCount"></div>
						<div class="file-items" id="fileItems"></div>
					</div>
				</div>

				<div class="section">
					<button type="button" class="button" id="uploadBtn">
						⬆ Upload Files
					</button>
				</div>

				<div id="status"></div>
			</div>
		</div>

		<div class="footer">IEPF Document Management</div>
	</div>

	<script>
		/* ==========================================
		   WORKDRIVE CATEGORY FOLDER IDS
		========================================== */

		const categoryIds = {
			"KFIN Information": "5oq1b35cfe93a3e804fb4f6732dedef5422",
			"VR": "5twqzc3d5079cea194d6fb20019d098939249",
			"VR Signed": "6a1v0fab7062eafa54a4aaa4b8f27bb548785",
			"EVR": "6a1v0a8bc9ecc4dd84f1080e8d97d2f4777f1",
			"EVR Signed": "6a1v0673c077c8be94deab0ff3f5e3a1373a3",
			"Receipt": "6a1v0367f4f7f5a234e73901bfa5f66957b90",
			"Upload Shares Released": "991a6df09338acb10432a9748ff359cbb91e2",
			"Upload MCA Report": "991a6ab4a098892784d89b54449b76ef9fd38"
		};

		/* ==========================================
		   ELEMENTS
		========================================== */

		const categoryElement = document.getElementById("category");
		const dateContainer = document.getElementById("dateContainer");
		const dateElement = document.getElementById("date");
		const fileInput = document.getElementById("fileInput");
		const uploadArea = document.getElementById("uploadArea");
		const uploadBtn = document.getElementById("uploadBtn");
		const fileList = document.getElementById("fileList");
		const fileItems = document.getElementById("fileItems");
		const fileCount = document.getElementById("fileCount");
		const statusElement = document.getElementById("status");

		/* ==========================================
		   STATUS AND HTML HELPERS
		========================================== */

		function showStatus(message, type) {
			statusElement.className = "";
			statusElement.classList.add("status-" + type);
			statusElement.innerHTML = message;
		}

		function escapeHtml(value) {
			const div = document.createElement("div");
			div.textContent = String(value ?? "");
			return div.innerHTML;
		}

		function formatFileSize(bytes) {
			if (bytes < 1024) return bytes + " B";
			if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
			return (bytes / (1024 * 1024)).toFixed(2) + " MB";
		}

		/* ==========================================
		   CATEGORY CHANGE
		========================================== */

		categoryElement.addEventListener("change", function () {
			if (this.value === "EVR Signed") {
				dateContainer.style.display = "block";
			} else {
				dateContainer.style.display = "none";
				dateElement.value = "";
			}
		});

		/* ==========================================
		   DISPLAY SELECTED FILES
		========================================== */

		function displayFiles(files) {
			fileItems.innerHTML = "";

			if (!files || files.length === 0) {
				fileList.style.display = "none";
				return;
			}

			fileList.style.display = "block";

			fileCount.textContent =
				files.length + (files.length === 1 ? " file selected" : " files selected");

			Array.from(files).forEach(function (file) {
				const item = document.createElement("div");
				item.className = "file-item";

				const icon = document.createElement("div");
				icon.className = "file-icon";
				icon.textContent = "📄";

				const info = document.createElement("div");
				info.className = "file-info";

				const name = document.createElement("div");
				name.className = "file-name";
				name.textContent = file.name;

				const size = document.createElement("div");
				size.className = "file-size";
				size.textContent = formatFileSize(file.size);

				info.appendChild(name);
				info.appendChild(size);
				item.appendChild(icon);
				item.appendChild(info);
				fileItems.appendChild(item);
			});
		}

		fileInput.addEventListener("change", function () {
			displayFiles(this.files);

			if (this.files.length > 0) {
				showStatus(
					this.files.length + " file(s) selected and ready to upload.",
					"info"
				);
			}
		});

		/* ==========================================
		   DRAG AND DROP
		========================================== */

		uploadArea.addEventListener("dragover", function (event) {
			event.preventDefault();
			uploadArea.classList.add("drag-active");
		});

		uploadArea.addEventListener("dragleave", function () {
			uploadArea.classList.remove("drag-active");
		});

		uploadArea.addEventListener("drop", function (event) {
			event.preventDefault();
			uploadArea.classList.remove("drag-active");

			const droppedFiles = event.dataTransfer.files;

			if (droppedFiles.length > 0) {
				// Assign dropped files to the file input so the upload
				// handler can use fileInput.files.
				const transfer = new DataTransfer();

				Array.from(droppedFiles).forEach(function (file) {
					transfer.items.add(file);
				});

				fileInput.files = transfer.files;
				displayFiles(fileInput.files);

				showStatus(
					droppedFiles.length + " file(s) selected and ready to upload.",
					"info"
				);
			}
		});

		/* ==========================================
		   PARSE ZOHO RESPONSE
		========================================== */

		function parseZohoResponse(response) {
			let result = response;

			if (result && result.statusMessage !== undefined) {
				result = result.statusMessage;
			}

			if (typeof result === "string") {
				try {
					result = JSON.parse(result);
				} catch (error) {
					// Keep the original response.
				}
			}

			if (result && result.response !== undefined && result.data === undefined) {
				result = result.response;

				if (typeof result === "string") {
					try {
						result = JSON.parse(result);
					} catch (error) {
						// Keep the original response.
					}
				}
			}

			return result;
		}

		/* ==========================================
		   UPLOAD ONE FILE TO WORKDRIVE
		========================================== */


async function uploadFileToWorkDrive(file, folderId) {
    if (!(file instanceof File) || file.size === 0) {
        throw new Error("Please provide a valid, non-empty File object.");
    }

    if (!folderId) {
        throw new Error("WorkDrive folder ID is missing.");
    }

    if (file.size > 20 * 1024 * 1024) {
        throw new Error("File exceeds the Zoho Desk SDK 20 MB limit.");
    }

    const requestObj = {
        url: "https://www.zohoapis.in/workdrive/api/v1/upload",
        type: "POST",

        headers: {
            "Authorization": "Zoho-oauthtoken 1000.bd647f68bdc1028f563dc2f24d406147.33c3fbadb7923ecfc1eb9c5147d74d0e",
            "Accept": "application/vnd.api+json",
            "Content-Type": "multipart/form-data"
        },

        postBody: {
            parent_id: folderId,
            filename: encodeURIComponent(file.name),
            "override-name-exist": "true"
        },

        fileObj: [
            {
                key: "content",
                file: file
            }
        ],

       
    };

    console.log("Uploading file:", {
        name: file.name,
        size: file.size,
        type: file.type,
        folderId: folderId,
        fileObjectValid: requestObj.fileObj[0].file instanceof File
    });

    const rawResponse = await ZOHODESK.request(requestObj);

    console.log("Raw WorkDrive response:", rawResponse);

    const result = typeof rawResponse === "string"
        ? JSON.parse(rawResponse)
        : rawResponse;

    const body = typeof result?.response === "string"
        ? JSON.parse(result.response)
        : result?.response ?? result;

    if (
        Number(result?.statusCode) >= 400 ||
        body?.status === false ||
        body?.status === "false" ||
        body?.statusMessage?.errors?.length
    ) {
        throw new Error(JSON.stringify(body));
    }

    console.log("WorkDrive upload response:", body);
    return body;
}



		/* ==========================================
		   UPLOAD MULTIPLE FILES
		========================================== */

		async function uploadMultipleFiles(files, folderId) {
			const successfulFiles = [];
			const failedFiles = [];
			const fileArray = Array.from(files || []);

			for (let i = 0; i < fileArray.length; i++) {
				const file = fileArray[i];

				showStatus(
					"Uploading file " + (i + 1) + " of " + fileArray.length +
					": <strong>" + escapeHtml(file.name) + "</strong>",
					"info"
				);
				console.log("Selected file:", file.name, file.size, file.type);

				try {
					await uploadFileToWorkDrive(file, folderId);
					successfulFiles.push(file.name);
				} catch (error) {
					console.error("Upload failed for " + file.name + ":", error);

					failedFiles.push({
						name: file.name,
						message: error && error.message
							? error.message
							: String(error)
					});
				}
			}

			let message = "";

			if (successfulFiles.length > 0) {
				message += "✓ Successfully uploaded " + successfulFiles.length +
					" of " + fileArray.length + " file(s).<br>";

				message += successfulFiles.map(function (name) {
					return "• " + escapeHtml(name);
				}).join("<br>");
			}

			if (failedFiles.length > 0) {
				message += (message ? "<br><br>" : "") +
					"⚠ Failed to upload " + failedFiles.length + " file(s):<br>";

				message += failedFiles.map(function (item) {
					return "• " + escapeHtml(item.name) + " — " +
						escapeHtml(item.message);
				}).join("<br>");
			}

			if (fileArray.length === 0) {
				showStatus("Please select at least one document.", "warning");
			} else {
				showStatus(
					message,
					failedFiles.length > 0 ? "warning" : "success"
				);
			}

			return {
				successfulFiles: successfulFiles,
				failedFiles: failedFiles
			};
		}

		/* ==========================================
		   CREATE DATE FOLDER FOR EVR SIGNED
		========================================== */

		async function createWorkDriveFolder(parentFolderId, folderName) {
			const requestBody = {
				data: {
					attributes: {
						parent_id: parentFolderId,
						name: folderName
					},
					type: "files"
				}
			};

			console.log("Creating WorkDrive folder with request body:", requestBody);

			const response = await ZOHODESK.request({
				url: "https://www.zohoapis.in/workdrive/api/v1/files",
				type: "POST",
				headers: {
					"Accept": "application/vnd.api+json",
					"Content-Type": "application/vnd.api+json"
				},
				postBody: JSON.stringify(requestBody),
				connectionLinkName: "zoho_workdrive_widget"
			});

			const result = parseZohoResponse(response);

			console.log("WorkDrive folder creation response:", result);

			const createdFolderId =
				result?.statusMessage?.data?.id ||
				result?.data?.[0]?.id ||
				result?.data?.[0]?.attributes?.id ||
				result?.id;

			if (!createdFolderId) {
				throw new Error(
					"Folder ID not found in response. Check the browser console."
				);
			}

			return createdFolderId;
		}

		/* ==========================================
		   MAIN UPLOAD BUTTON
		========================================== */

		uploadBtn.addEventListener("click", async function () {
			const category = categoryElement.value;

			// Validate category.
			if (!category) {
				showStatus("⚠ Please select a document category.", "warning");
				categoryElement.focus();
				return;
			}

			// Validate date for EVR Signed.
			let dateValue = "";

			if (category === "EVR Signed") {
				dateValue = dateElement.value.trim();

				if (!dateValue) {
					showStatus(
						"⚠ Please enter the document date in YYYY-MM-DD format.",
						"warning"
					);
					dateElement.focus();
					return;
				}

				const match = dateValue.match(/^(\d{4})-(\d{2})-(\d{2})$/);
				let validDate = false;

				if (match) {
					const year = Number(match[1]);
					const month = Number(match[2]);
					const day = Number(match[3]);
					const parsedDate = new Date(Date.UTC(year, month - 1, day));

					validDate =
						parsedDate.getUTCFullYear() === year &&
						parsedDate.getUTCMonth() === month - 1 &&
						parsedDate.getUTCDate() === day;
				}

				if (!validDate) {
					showStatus(
						"⚠ Invalid date. Enter a valid date in YYYY-MM-DD format.",
						"warning"
					);
					dateElement.focus();
					return;
				}
			}

			// Get selected files from the Documents field.
			const fileInput1 = document.getElementById("fileInput");
			const files = fileInput1.files;

			if (!files || files.length === 0) {
				showStatus("⚠ Please select at least one document.", "warning");
				return;
			}

			// Find the category's WorkDrive folder.
			const parentFolderId = categoryIds[category];

			if (!parentFolderId) {
				showStatus(
					"⚠ Folder ID is not configured for this category.",
					"warning"
				);
				return;
			}

			uploadBtn.disabled = true;

			try {
				// Default destination is the category folder.
				let destinationFolderId = parentFolderId;
				console.log("Destination folder ID:", destinationFolderId);
				// EVR Signed: create a date folder first.
				if (category === "EVR Signed") {
					showStatus(
						"Creating WorkDrive folder <strong>" +
						escapeHtml(dateValue) + "</strong>...",
						"info"
					);

					destinationFolderId = await createWorkDriveFolder(
						parentFolderId,
						dateValue
					);

					console.log("Created folder ID:", destinationFolderId);
				}

				// Upload every selected file to the destination folder.
				await uploadMultipleFiles(files, destinationFolderId);

			} catch (error) {
				console.error("WorkDrive operation failed:", error);

				showStatus(
					"⚠ WorkDrive operation failed: " +
					escapeHtml(error && error.message
						? error.message
						: String(error)),
					"error"
				);
			} finally {
				uploadBtn.disabled = false;
			}
		});
	</script>
